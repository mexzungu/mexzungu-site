body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5}

.hdr{padding:28px 24px 0;max-width:1600px;margin:0 auto}
.hdr h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hdr p{color:var(--muted);font-size:12px;margin-bottom:16px}

.tab-btn{font-size:12px;font-weight:600;padding:8px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;transition:.15s;margin-bottom:-1px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--conn)}
.filters{padding:12px 24px;max-width:1600px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;gap:4px;align-items:center}
.filter-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.pill{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.pill:hover{color:var(--text);border-color:#555}
.pill.active{color:#fff;border-color:transparent}
.pill-conn.active{background:rgba(76,200,180,.15);border-color:var(--conn);color:var(--conn)}
.pill-val.active{background:rgba(240,160,48,.15);border-color:var(--val);color:var(--val)}
.pill-care.active{background:rgba(180,130,255,.15);border-color:var(--care);color:var(--care)}
.pill-core.active{background:rgba(148,163,184,.15);border-color:var(--core);color:var(--core)}
.pill-pers.active{background:rgba(224,80,144,.15);border-color:var(--pers);color:var(--pers)}
.pill-p1.active{background:rgba(224,80,80,.15);border-color:var(--p1);color:var(--p1)}
.pill-p2.active{background:rgba(240,160,48,.15);border-color:var(--p2);color:var(--p2)}
.pill-p3.active{background:rgba(76,175,125,.15);border-color:var(--p3);color:var(--p3)}
.pill-all.active{background:rgba(255,255,255,.07);border-color:#555;color:var(--text)}
input.search{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;font-size:12px;width:220px;outline:none;transition:.15s;font-family:inherit}
input.search:focus{border-color:#555}
input.search::placeholder{color:var(--muted)}
.count{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.wrap{padding:0 24px 80px;max-width:1600px;margin:0 auto;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{border-bottom:2px solid var(--border2)}
th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:.1s}
tbody tr:hover{background:var(--surface)}
td{padding:8px 10px;vertical-align:top}
.col-code{width:120px}.col-name{width:170px}.col-desc{min-width:200px}.col-owner{width:90px}.col-kpi{width:155px}.col-engine{width:120px}.col-serves{width:135px}.col-notes{min-width:120px}
.macro-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:20px}

.mb-val{color:var(--val);background:rgba(240,160,48,.08);border:1px solid rgba(240,160,48,.2)}
.mb-care{color:var(--care);background:rgba(180,130,255,.08);border:1px solid rgba(180,130,255,.2)}
.mb-core{color:var(--core);background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.2)}
.mb-pers{color:var(--pers);background:rgba(224,80,144,.08);border:1px solid rgba(224,80,144,.2)}
.pri{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px}
.pri-P1{color:var(--p1);background:rgba(224,80,80,.1)}
.pri-P2{color:var(--p2);background:rgba(240,160,48,.1)}
.pri-P3{color:var(--p3);background:rgba(76,175,125,.1)}
.kpi-list{list-style:none;padding:0;margin:0}
.kpi-list li{color:var(--muted2);font-size:11px;padding:1px 0}
.kpi-list li::before{content:"· ";color:var(--muted)}
.note{color:var(--p2);font-size:11px}.note-red{color:var(--red);font-size:11px}
.old-code{color:var(--muted);font-size:10px;display:block;margin-top:2px}
.serves{color:var(--muted2);font-size:11px;line-height:1.4}
.owner-str{font-size:11px;color:var(--muted2)}
.eng-tag{font-size:11px;font-weight:600;color:var(--muted2)}
.skills-wrap{padding:0 24px 80px;max-width:1600px;margin:0 auto}
.cat-section{margin-bottom:28px}
.cat-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.skill-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;transition:.15s}
.skill-card:hover{border-color:#444;background:#1d1d1d}
.skill-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.skill-slug{font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:4px}
.skill-desc{font-size:11px;color:var(--muted2);line-height:1.4}
.cat-badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-bottom:4px}
.cat-persona{color:var(--conn);background:rgba(76,200,180,.08);border:1px solid rgba(76,200,180,.15)}
.cat-mglops{color:var(--val);background:rgba(240,160,48,.08);border:1px solid rgba(240,160,48,.15)}
.cat-infra{color:var(--core);background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.15)}
.cat-client{color:var(--care);background:rgba(180,130,255,.08);border:1px solid rgba(180,130,255,.15)}
.cat-content{color:var(--pink);background:rgba(225,75,135,.08);border:1px solid rgba(225,75,135,.15)}
.cat-jouissance{color:var(--pers);background:rgba(224,80,144,.08);border:1px solid rgba(224,80,144,.15)}

.filter-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter-row .filter-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;white-space:nowrap}

.filter-row input.search::placeholder{color:var(--muted)}
.registry-count{font-size:11px;color:var(--muted);margin-left:auto}
.registry-section{padding:12px 24px 0;max-width:1600px;margin:0 auto}
.section-head{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding-bottom:48px}
.proc-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;transition:.15s;display:flex;flex-direction:column;gap:4px}
.proc-card:hover{border-color:#444;background:#1d1d1d}
.proc-card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.proc-card-name{font-size:12px;font-weight:700;color:var(--text);font-family:monospace;margin-top:2px}
.proc-card-desc{font-size:11px;color:var(--muted2);line-height:1.4;flex:1}
.proc-card-meta{font-size:10px;color:var(--muted);margin-top:2px}

const MC={connection:'conn',value:'val',care:'care',core:'core',personal:'pers'};
const catClass={'MGL Persona':'cat-persona','MGL Ops':'cat-mglops','Janis Infra':'cat-infra','Client & Legal':'cat-client','Content':'cat-content','Jouissance':'cat-jouissance','Partnerships':'cat-partner','Tools':'cat-tools'};
const catOrder=['MGL Persona','MGL Ops','Janis Infra','Client & Legal','Content','Jouissance','Partnerships','Tools'];
const fState={type:'all',engine:'all'};

function matchEngine(r,eng){
  if(eng==='all') return true;
  if(eng==='connection') return r.macro==='connection';
  if(eng==='value') return r.macro==='value';
  if(eng==='care') return r.macro==='care';
  if(eng==='body') return r.macro==='personal'&&r.engine==='Body';
  if(eng==='mind') return r.macro==='personal'&&r.engine==='Mind';
  if(eng==='soul') return r.macro==='personal'&&r.engine==='Soul';
  if(eng==='mglcore') return r.macro==='core';
  if(eng==='lfecore') return r.macro==='personal';
  if(eng==='other') return !['connection','value','care','core','personal'].includes(r.macro);
  return true;
}

function setType(t,btn){
  fState.type=t;
  document.querySelectorAll('.unified-filters .filter-row:first-child .pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setEngine(e,btn){
  fState.engine=e;
  document.querySelectorAll('.unified-filters .filter-row:last-child .pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const q=(document.getElementById('reg-search').value||'').toLowerCase();
  const showProc=fState.type==='all'||fState.type==='proc';
  const showSkills=fState.type==='all'||fState.type==='skills';
  document.getElementById('reg-proc').style.display=showProc?'':'none';
  document.getElementById('reg-skills').style.display=showSkills?'':'none';
  let total=0;
  if(showProc){
    const rows=C.filter(r=>{
      if(!matchEngine(r,fState.engine)) return false;
      if(q&&!(r.code.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||r.owner.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)||r.engine.toLowerCase().includes(q))) return false;
      return true;
    });
    document.getElementById('proc-count').textContent='('+rows.length+')';
    total+=rows.length;
    document.getElementById('proc-grid').innerHTML=rows.map(r=>`<div class="proc-card">
<div class="proc-card-top"><span class="macro-badge mb-${MC[r.macro]||'core'}">${r.engine}</span><span class="pri pri-${r.pri}">${r.pri}</span></div>
<div class="proc-card-name">${r.name}</div>
<div class="proc-card-desc">${r.desc}</div>
<div class="proc-card-meta">${r.owner} &middot; <span style="font-family:monospace">${r.code}</span></div>
</div>`).join('');
  }
  if(showSkills){
    const f=SK.filter(s=>!q||(s.name.includes(q)||s.label.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q)));
    document.getElementById('skills-count').textContent='('+f.length+')';
    total+=f.length;
    const card=s=>`<div class="skill-card"><div class="cat-badge ${catClass[s.cat]||''}">${s.cat}</div><div class="skill-name">${s.label}</div><div class="skill-slug">${s.name}</div><div class="skill-desc">${s.desc}</div></div>`;
    const grid=document.getElementById('skills-grid');
    if(!q&&fState.engine==='all'){
      const by={};f.forEach(s=>{if(!by[s.cat])by[s.cat]=[];by[s.cat].push(s);});
      grid.innerHTML=catOrder.filter(c=>by[c]).map(c=>`<div class="cat-section"><div class="cat-title">${c} <span style="color:var(--muted);font-weight:400">(${by[c].length})</span></div><div class="skill-grid">${by[c].map(card).join('')}</div></div>`).join('');
    } else {
      grid.innerHTML=`<div class="skill-grid">${f.map(card).join('')}</div>`;
    }
  }
  document.getElementById('reg-count').textContent=total+' items';
}

render();
