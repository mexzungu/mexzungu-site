<!--
  MEXZUNGU CLIENT HUB // TEMPLATE v1
  ===================================
  1. Copy this folder to clients/[client-slug]/
  2. Edit data.json. Never touch this file.
  3. Generate a token: any unique string e.g. "cl2026-xk9m"
  4. Set accent_color to give each client a distinct visual identity
  5. Deploy: cd /home/mexzungu/mexzungu-site && bash deploy.sh
  6. Share:  mexzungu.com/clients/[slug]/?token=[token]

  Accent color palette used across clients:
    HavenPay  →  #e14b87  (pink)
    Duara     →  #c98f1a  (amber/gold)
    NCA       →  #4a8fd4  (blue)
    Inscape   →  #28a856  (green)
    New client → pick any hex, the JS handles all variants
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <title>Client Hub | Mexzungu Group</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #0d0d0d;
      --bg-card:     #131313;
      --bg-mid:      #1a1a1a;
      --bg-hover:    #1e1e1e;
      --border:      #1f1f1f;
      --border-mid:  #2a2a2a;
      --text:        #f0ebe7;
      --text-mid:    #b8b0aa;
      --text-soft:   #7a7068;
      --text-ghost:  #484038;

      /* Accent: overridden per client via JS using data.json accent_color */
      --accent:        #e14b87;
      --accent-dim:    rgba(225,75,135,0.12);
      --accent-border: rgba(225,75,135,0.25);

      --amber:       #c98f1a;
      --amber-dim:   rgba(201,143,26,0.1);
      --green:       #28a856;
      --green-dim:   rgba(40,168,86,0.1);
      --red:         #d94444;
      --red-dim:     rgba(217,68,68,0.1);
      --blue:        #4a8fd4;
      --blue-dim:    rgba(74,143,212,0.1);

      --sans:  'Space Grotesk', -apple-system, sans-serif;
      --mono:  'IBM Plex Mono', monospace;
      --head:  'RocknRoll One', 'Space Grotesk', sans-serif;
    }

    html { background: var(--bg); }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    .hidden { display: none !important; }

    /* ── ACCESS DENIED ─────────────────────────────────────────── */
    #denied {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .denied-inner { text-align: center; max-width: 360px; }
    .denied-label {
      font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1.5rem;
    }
    .denied-title {
      font-family: var(--head); font-size: 1.5rem;
      color: var(--text); margin-bottom: 0.75rem; line-height: 1.2;
    }
    .denied-sub { font-size: 0.85rem; color: var(--text-soft); line-height: 1.7; }
    .denied-sub a { color: var(--accent); text-decoration: none; }

    /* ── HUB WRAPPER ────────────────────────────────────────────── */
    #hub { max-width: 1080px; margin: 0 auto; padding: 0 2rem 6rem; }

    /* ── TOP BAR ───────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.75rem 0 1.5rem;
      border-bottom: 1px solid var(--border-mid);
      gap: 1.5rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 1.25rem; }
    .topbar-logo { height: 32px; width: auto; opacity: 0.9; }
    .topbar-sep { width: 1px; height: 20px; background: var(--border-mid); flex-shrink: 0; }
    .topbar-hub-label {
      font-family: var(--mono); font-size: 0.65rem;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
    }
    .topbar-right { text-align: right; flex-shrink: 0; }
    .topbar-client {
      font-family: var(--head); font-size: 1rem;
      color: var(--text); line-height: 1.2;
    }
    .topbar-updated {
      font-family: var(--mono); font-size: 0.63rem;
      color: var(--text-ghost); margin-top: 3px;
    }

    /* ── HERO ──────────────────────────────────────────────────── */
    .hero {
      padding: 3rem 0 2.5rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-engagement {
      font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-ghost); margin-bottom: 0.75rem;
    }
    .hero-title {
      font-family: var(--head); font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--text); line-height: 1.15; margin-bottom: 0.5rem;
    }
    .hero-tagline { font-size: 0.9rem; color: var(--text-soft); margin-bottom: 0; }
    .hero-status {
      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-top: 1.25rem;
      padding: 0.35rem 0.9rem;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      font-family: var(--mono); font-size: 0.65rem;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
    }
    .hero-status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }

    /* ── SECTION LAYOUT ────────────────────────────────────────── */
    .section { padding: 2.5rem 0; border-bottom: 1px solid var(--border); }
    .section:last-of-type { border-bottom: none; }
    .section-label {
      font-family: var(--mono); font-size: 0.65rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1.5rem;
    }

    /* ── AWAITING ──────────────────────────────────────────────── */
    .awaiting-card {
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      display: flex; align-items: flex-start; gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .awaiting-card:last-child { margin-bottom: 0; }
    .awaiting-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0; margin-top: 6px;
      box-shadow: 0 0 0 3px var(--accent-dim);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px var(--accent-dim); }
      50%       { box-shadow: 0 0 0 7px rgba(0,0,0,0); }
    }
    .awaiting-body { flex: 1; min-width: 0; }
    .awaiting-title {
      font-size: 0.92rem; font-weight: 600;
      color: var(--text); margin-bottom: 0.35rem;
    }
    .awaiting-detail {
      font-size: 0.82rem; color: var(--text-mid); line-height: 1.65;
    }
    .awaiting-cta {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-top: 0.9rem; padding: 0.45rem 1.1rem;
      background: var(--accent); color: #fafafa;
      border-radius: 6px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: opacity 0.15s;
      letter-spacing: 0.01em;
    }
    .awaiting-cta:hover { opacity: 0.82; color: #fafafa; }

    /* ── WORKSTREAMS ───────────────────────────────────────────── */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.875rem;
    }
    @media (max-width: 640px) { .ws-grid { grid-template-columns: 1fr; } }

    .ws-card {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 1.4rem 1.5rem;
      display: flex; flex-direction: column;
      transition: border-color 0.2s;
      position: relative; overflow: hidden;
    }
    .ws-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: transparent; transition: background 0.2s;
    }
    .ws-card.status-in-progress::before  { background: var(--amber); }
    .ws-card.status-delivered::before    { background: var(--green); }
    .ws-card.status-under-review::before { background: var(--accent); }
    .ws-card.status-blocked::before      { background: var(--red); }

    .ws-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.8rem; }
    .ws-code {
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--accent); letter-spacing: 0.1em; margin-bottom: 0.3rem;
    }
    .ws-title { font-size: 0.95rem; font-weight: 600; color: var(--text); line-height: 1.25; }
    .ws-desc {
      font-size: 0.8rem; color: var(--text-soft);
      line-height: 1.7; flex: 1; margin-bottom: 1rem;
    }
    .ws-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; margin-top: auto;
    }
    .ws-deliverable {
      font-family: var(--mono); font-size: 0.63rem;
      color: var(--text-ghost); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ws-eta     { font-family: var(--mono); font-size: 0.63rem; color: var(--text-soft); flex-shrink: 0; }
    .ws-updated { font-family: var(--mono); font-size: 0.6rem;  color: var(--text-ghost); flex-shrink: 0; }

    /* ── BADGES ────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.22rem 0.6rem; border-radius: 20px;
      font-family: var(--mono); font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    .b-not-started  { background: rgba(72,64,56,0.3);  color: var(--text-ghost); }
    .b-not-started .badge-dot  { background: var(--text-ghost); }
    .b-in-progress  { background: var(--amber-dim);    color: var(--amber);  border: 1px solid rgba(201,143,26,0.2); }
    .b-in-progress .badge-dot  { background: var(--amber); }
    .b-delivered    { background: var(--green-dim);    color: var(--green);  border: 1px solid rgba(40,168,86,0.2); }
    .b-delivered .badge-dot    { background: var(--green); }
    .b-under-review { background: var(--accent-dim);   color: var(--accent); border: 1px solid var(--accent-border); }
    .b-under-review .badge-dot { background: var(--accent); }
    .b-blocked      { background: var(--red-dim);      color: var(--red);    border: 1px solid rgba(217,68,68,0.2); }
    .b-blocked .badge-dot      { background: var(--red); }
    .b-pending      { background: rgba(72,64,56,0.3);  color: var(--text-soft); }
    .b-pending .badge-dot      { background: var(--text-soft); }
    .b-upcoming     { background: var(--blue-dim);     color: var(--blue);   border: 1px solid rgba(74,143,212,0.2); }
    .b-upcoming .badge-dot     { background: var(--blue); }
    .b-paid         { background: var(--green-dim);    color: var(--green);  border: 1px solid rgba(40,168,86,0.2); }
    .b-paid .badge-dot         { background: var(--green); }
    .b-invoiced     { background: var(--amber-dim);    color: var(--amber);  border: 1px solid rgba(201,143,26,0.2); }
    .b-invoiced .badge-dot     { background: var(--amber); }
    .b-overdue      { background: var(--red-dim);      color: var(--red);    border: 1px solid rgba(217,68,68,0.2); }
    .b-overdue .badge-dot      { background: var(--red); }

    /* ── TABLES (tasks + billing) ──────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      font-family: var(--mono); font-size: 0.62rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-ghost); text-align: left;
      padding: 0 1rem 0.8rem 0; border-bottom: 1px solid var(--border-mid);
    }
    .data-table th.right { text-align: right; padding-right: 0; }
    .data-table td {
      padding: 1rem 1rem 1rem 0;
      border-bottom: 1px solid var(--border); font-size: 0.85rem;
      vertical-align: top;
    }
    .data-table td.right { text-align: right; }
    .data-table tr:last-child td { border-bottom: none; }
    .cell-title  { color: var(--text); font-weight: 500; }
    .cell-note   { font-size: 0.75rem; color: var(--text-ghost); margin-top: 0.2rem; line-height: 1.5; }
    .cell-sub    { font-size: 0.82rem; color: var(--text-mid); }
    .cell-mono   { font-family: var(--mono); font-size: 0.78rem; color: var(--text-soft); }
    .cell-amount { font-family: var(--mono); font-size: 0.9rem; color: var(--text); font-weight: 500; }

    .empty-row td {
      text-align: center; padding: 2.5rem 0 !important;
      font-family: var(--mono); font-size: 0.72rem; color: var(--text-ghost);
      border-bottom: none !important; line-height: 2;
    }

    /* ── DOCUMENT TABS ─────────────────────────────────────────── */
    .doc-nav {
      display: flex; align-items: center; gap: 0;
      border-bottom: 1px solid var(--border-mid); margin-bottom: 1.5rem;
    }
    .doc-tab {
      padding: 0.55rem 1.25rem; font-size: 0.8rem; font-weight: 500;
      color: var(--text-ghost); cursor: pointer;
      border: none; background: none; font-family: var(--sans);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .doc-tab:first-child { padding-left: 0; }
    .doc-tab:hover { color: var(--text-mid); }
    .doc-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .doc-panel { display: none; }
    .doc-panel.active { display: block; }

    .doc-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .doc-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 0.9rem 1.25rem;
      background: var(--bg-card); border: 1px solid var(--border-mid);
      border-radius: 8px; text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .doc-row:hover { border-color: var(--border-mid); background: var(--bg-hover); }
    .doc-left { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
    .doc-icon { font-size: 1rem; flex-shrink: 0; opacity: 0.65; }
    .doc-name { font-size: 0.85rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-date { font-family: var(--mono); font-size: 0.65rem; color: var(--text-ghost); margin-top: 0.15rem; }
    .doc-chip {
      font-family: var(--mono); font-size: 0.6rem; color: var(--text-ghost);
      background: var(--bg-mid); border: 1px solid var(--border-mid);
      border-radius: 4px; padding: 0.18rem 0.5rem; flex-shrink: 0;
    }
    .doc-empty {
      padding: 2.5rem 1.25rem; text-align: center;
      font-family: var(--mono); font-size: 0.72rem; color: var(--text-ghost);
      line-height: 2;
    }

    /* ── FOOTER ────────────────────────────────────────────────── */
    .hub-footer {
      padding: 2rem 0;
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 0.65rem; color: var(--text-ghost);
      gap: 1rem; flex-wrap: wrap;
    }
    .hub-footer a { color: var(--accent); text-decoration: none; transition: opacity 0.15s; }
    .hub-footer a:hover { opacity: 0.75; }

    /* ── MOBILE ────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #hub { padding: 0 1.25rem 4rem; }
      .topbar { flex-wrap: wrap; }
      .topbar-right { text-align: left; }
      .data-table th:nth-child(3),
      .data-table td:nth-child(3) { display: none; }
      .doc-name { white-space: normal; }
    }
  </style>
</head>
<body>

<!-- ACCESS DENIED -->
<div id="denied" class="hidden">
  <div class="denied-inner">
    <div class="denied-label">Mexzungu Group · Client Hub</div>
    <div class="denied-title">Access restricted</div>
    <div class="denied-sub">
      Your link may have expired or be invalid.<br>
      Contact <a href="mailto:pepe@mexzungu.com" id="js-denied-email">pepe@mexzungu.com</a> to get access.
    </div>
  </div>
</div>

<!-- HUB -->
<div id="hub" class="hidden">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo-v3.png" alt="Mexzungu" class="topbar-logo">
      <div class="topbar-sep"></div>
      <span class="topbar-hub-label">Client Hub</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-client" id="js-client-name"></div>
      <div class="topbar-updated">Updated <span id="js-updated"></span></div>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-engagement" id="js-engagement"></div>
    <div class="hero-title" id="js-hero-title"></div>
    <div class="hero-tagline" id="js-tagline"></div>
    <div id="js-hero-status" class="hero-status hidden">
      <span class="hero-status-dot"></span>
      <span id="js-status-text"></span>
    </div>
  </div>

  <!-- AWAITING CLIENT -->
  <div class="section" id="js-awaiting-section" style="display:none;">
    <div class="section-label">Action Required</div>
    <div id="js-awaiting-list"></div>
  </div>

  <!-- WORKSTREAMS -->
  <div class="section">
    <div class="section-label">Workstreams</div>
    <div class="ws-grid" id="js-ws-grid"></div>
  </div>

  <!-- TASKS IN MOTION -->
  <div class="section">
    <div class="section-label">Tasks in Motion</div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Task</th>
          <th>Owner</th>
          <th>ETA</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="js-tasks-body"></tbody>
    </table>
  </div>

  <!-- DOCUMENTS -->
  <div class="section">
    <div class="section-label">Documents</div>
    <div class="doc-nav">
      <button class="doc-tab active" data-tab="engagement">Engagement</button>
      <button class="doc-tab" data-tab="deliverables">Deliverables</button>
      <button class="doc-tab" data-tab="reference">Reference</button>
    </div>
    <div id="panel-engagement" class="doc-panel active"></div>
    <div id="panel-deliverables" class="doc-panel"></div>
    <div id="panel-reference" class="doc-panel"></div>
  </div>

  <!-- BILLING -->
  <div class="section">
    <div class="section-label">Billing</div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Description</th>
          <th>Due Date</th>
          <th>Status</th>
          <th class="right">Amount</th>
        </tr>
      </thead>
      <tbody id="js-billing-body"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="hub-footer">
    <span>Mexzungu Group &nbsp;·&nbsp; <a href="mailto:pepe@mexzungu.com" id="js-pm-email"></a></span>
    <span><a href="https://mexzungu.com" target="_blank">mexzungu.com</a></span>
  </div>

</div>

<script>
  // ── ACCENT COLOR ──────────────────────────────────────────────────
  function applyAccent(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const root = document.documentElement;
    root.style.setProperty('--accent',        hex);
    root.style.setProperty('--accent-dim',    `rgba(${r},${g},${b},0.12)`);
    root.style.setProperty('--accent-border', `rgba(${r},${g},${b},0.25)`);
  }

  // ── STATUS BADGE ─────────────────────────────────────────────────
  const STATUS_LABELS = {
    'not-started':  'Not Started',
    'in-progress':  'In Progress',
    'delivered':    'Delivered',
    'under-review': 'Under Review',
    'blocked':      'Blocked',
    'pending':      'Pending',
    'upcoming':     'Upcoming',
    'paid':         'Paid',
    'invoiced':     'Invoiced',
    'overdue':      'Overdue',
  };
  function badge(status) {
    const cls = 'b-' + status;
    const label = STATUS_LABELS[status] || status;
    return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
  }

  // ── DOC ICON ─────────────────────────────────────────────────────
  const DOC_ICONS = { PDF: '📄', Doc: '📝', Sheet: '📊', Deck: '📑', Link: '🔗' };
  function docIcon(type) { return DOC_ICONS[type] || '📄'; }

  // ── RENDER ───────────────────────────────────────────────────────
  function render(d) {
    const m = d.meta;

    // Accent color
    if (m.accent_color) applyAccent(m.accent_color);

    // Titles
    document.title = m.client + ' | Mexzungu Client Hub';
    document.getElementById('js-client-name').textContent = m.client;
    document.getElementById('js-updated').textContent = m.updated;
    document.getElementById('js-engagement').textContent = m.engagement;
    document.getElementById('js-hero-title').textContent = m.client;
    document.getElementById('js-tagline').textContent = m.tagline || '';

    const pmEl = document.getElementById('js-pm-email');
    pmEl.textContent = m.pm_email;
    pmEl.href = 'mailto:' + m.pm_email;

    // Status summary pill (shows below tagline if set)
    if (m.status_summary) {
      document.getElementById('js-status-text').textContent = m.status_summary;
      document.getElementById('js-hero-status').classList.remove('hidden');
    }

    // Awaiting
    if (d.awaiting && d.awaiting.length > 0) {
      document.getElementById('js-awaiting-section').style.display = '';
      document.getElementById('js-awaiting-list').innerHTML = d.awaiting.map(a => `
        <div class="awaiting-card">
          <div class="awaiting-pulse"></div>
          <div class="awaiting-body">
            <div class="awaiting-title">${a.label}</div>
            <div class="awaiting-detail">${a.detail}</div>
            ${a.link ? `<a href="${a.link}" target="_blank" class="awaiting-cta">${a.cta} →</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    // Workstreams
    document.getElementById('js-ws-grid').innerHTML = d.workstreams.map(ws => {
      const slug = 'status-' + ws.status;
      return `
        <div class="ws-card ${slug}">
          <div class="ws-top">
            <div>
              <div class="ws-code">${ws.code}</div>
              <div class="ws-title">${ws.title}</div>
            </div>
            ${badge(ws.status)}
          </div>
          <div class="ws-desc">${ws.description}</div>
          <div class="ws-footer">
            <div class="ws-deliverable">↳ ${ws.deliverable}</div>
            ${ws.eta     ? `<div class="ws-eta">ETA ${ws.eta}</div>` : ''}
            ${ws.updated && !ws.eta ? `<div class="ws-updated">Updated ${ws.updated}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');

    // Tasks
    const tb = document.getElementById('js-tasks-body');
    if (!d.tasks || d.tasks.length === 0) {
      tb.innerHTML = '<tr class="empty-row"><td colspan="4">No active tasks right now</td></tr>';
    } else {
      tb.innerHTML = d.tasks.map(t => `
        <tr>
          <td>
            <div class="cell-title">${t.title}</div>
            ${t.note ? `<div class="cell-note">${t.note}</div>` : ''}
          </td>
          <td><div class="cell-sub">${t.owner}</div></td>
          <td><div class="cell-mono">${t.eta || ''}</div></td>
          <td>${badge(t.status)}</td>
        </tr>
      `).join('');
    }

    // Documents
    ['engagement', 'deliverables', 'reference'].forEach(cat => {
      const docs  = (d.documents || {})[cat] || [];
      const panel = document.getElementById('panel-' + cat);
      if (docs.length === 0) {
        const labels = { engagement: 'Engagement documents', deliverables: 'Deliverables', reference: 'Reference materials' };
        panel.innerHTML = `<div class="doc-empty">${labels[cat]} will appear here as they are added.</div>`;
      } else {
        panel.innerHTML = `<div class="doc-list">${docs.map(f => `
          <a href="${f.link}" target="_blank" class="doc-row">
            <div class="doc-left">
              <span class="doc-icon">${docIcon(f.type)}</span>
              <div>
                <div class="doc-name">${f.title}</div>
                <div class="doc-date">${f.date}</div>
              </div>
            </div>
            <span class="doc-chip">${f.type}</span>
          </a>
        `).join('')}</div>`;
      }
    });

    // Billing
    const bb = document.getElementById('js-billing-body');
    if (!d.billing || d.billing.length === 0) {
      bb.innerHTML = '<tr class="empty-row"><td colspan="4">Billing records will appear here once invoicing begins.</td></tr>';
    } else {
      bb.innerHTML = d.billing.map(b => `
        <tr>
          <td>
            <div class="cell-title">${b.description}</div>
            ${b.note ? `<div class="cell-note">${b.note}</div>` : ''}
          </td>
          <td><div class="cell-mono">${b.due || ''}</div></td>
          <td>${badge(b.status)}</td>
          <td class="right"><div class="cell-amount">${b.amount}</div></td>
        </tr>
      `).join('');
    }
  }

  // ── TABS ─────────────────────────────────────────────────────────
  document.querySelectorAll('.doc-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.tab;
      document.querySelectorAll('.doc-tab').forEach(t   => t.classList.toggle('active', t === btn));
      document.querySelectorAll('.doc-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + cat));
    });
  });

  // ── INIT ─────────────────────────────────────────────────────────
  (async function init() {
    let d;
    try {
      const res = await fetch('data.json');
      d = await res.json();
    } catch (e) {
      document.getElementById('denied').classList.remove('hidden');
      return;
    }

    const params = new URLSearchParams(location.search);
    const token  = params.get('token');

    if (!token || token !== d.meta.token) {
      document.getElementById('denied').classList.remove('hidden');
      return;
    }

    render(d);
    document.getElementById('hub').classList.remove('hidden');
  })();
</script>
</body>
</html>
