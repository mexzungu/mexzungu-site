<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <title>Agent Browser. Mexzungu Group</title>
  <style>
    :root {
      --pink: #FF1493;
      --pink-dim: rgba(255,20,147,0.15);
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: var(--pink); letter-spacing: -0.02em; }
    .count-badge {
      background: var(--pink-dim);
      color: var(--pink);
      border: 1px solid var(--pink);
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .controls {
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
    }
    .search-box:focus { border-color: var(--pink); }
    .filter-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: var(--pink); color: var(--text); }
    .chip.active { background: var(--pink-dim); border-color: var(--pink); color: var(--pink); font-weight: 600; }
    .table-wrap { overflow-x: auto; padding: 0 1.5rem 1.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; margin-top: 1rem; }
    th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 2px solid var(--border);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--pink); }
    th.sorted { color: var(--pink); }
    th .sort-arrow { margin-left: 0.3rem; opacity: 0.5; }
    th.sorted .sort-arrow { opacity: 1; }
    td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .agent-name { font-weight: 600; color: var(--text); }
    .agent-desc { color: var(--muted); font-size: 0.75rem; max-width: 320px; line-height: 1.4; }
    .badge { display: inline-block; border-radius: 4px; padding: 0.1rem 0.45rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.03em; }
    .tier-opus { background: rgba(220,60,60,0.2); color: #f87171; border: 1px solid rgba(220,60,60,0.4); }
    .tier-sonnet { background: rgba(60,120,220,0.2); color: #93c5fd; border: 1px solid rgba(60,120,220,0.4); }
    .tier-haiku { background: rgba(50,180,100,0.2); color: #6ee7b7; border: 1px solid rgba(50,180,100,0.4); }
    .tier-empty { background: var(--border); color: var(--muted); border: 1px solid transparent; }
    .owner-chip { display: inline-block; background: var(--pink-dim); color: var(--pink); border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.7rem; font-weight: 600; text-transform: capitalize; }
    .no-results { text-align: center; padding: 3rem; color: var(--muted); }
    footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: 1rem; }
    @media (max-width: 768px) {
      header { padding: 1rem; }
      .controls { padding: 0.75rem 1rem; }
      .table-wrap { display: none; }
      .cards { display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
      .card-name { font-weight: 700; margin-bottom: 0.4rem; color: var(--text); }
      .card-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; line-height: 1.5; }
      .card-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    }
    @media (min-width: 769px) { .cards { display: none; } }
  </style>
</head>

let sortCol = "name";
let sortAsc = true;
let activeOwner = "";
let searchTerm = "";

function tierClass(t) {
  if (!t) return "tier-empty";
  const m = t.toLowerCase();
  if (m.includes("opus")) return "tier-opus";
  if (m.includes("sonnet")) return "tier-sonnet";
  if (m.includes("haiku")) return "tier-haiku";
  return "tier-empty";
}

function ownerLabel(o) {
  return o ? o.charAt(0).toUpperCase() + o.slice(1) : "Janis";
}

function filtered() {
  return RAW.filter(a => {
    if (activeOwner && a.owner !== activeOwner) return false;
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      return (a.name + " " + a.description).toLowerCase().includes(q);
    }
    return true;
  });
}

function sorted(arr) {
  return [...arr].sort((a, b) => {
    let av = a[sortCol] !== undefined ? a[sortCol] : "";
    let bv = b[sortCol] !== undefined ? b[sortCol] : "";
    if (typeof av === "number") return sortAsc ? av - bv : bv - av;
    return sortAsc
      ? String(av).localeCompare(String(bv))
      : String(bv).localeCompare(String(av));
  });
}

function render() {
  const data = sorted(filtered());
  const tbody = document.getElementById("table-body");
  const noRes = document.getElementById("no-results");
  const cards = document.getElementById("cards");
  document.getElementById("count-badge").textContent = data.length + " agents";

  if (data.length === 0) {
    tbody.innerHTML = "";
    noRes.style.display = "block";
    cards.innerHTML = "";
    return;
  }
  noRes.style.display = "none";

  tbody.innerHTML = data.map(a => `
    <tr>
      <td><div class="agent-name">${a.name}</div></td>
      <td><span class="owner-chip">${ownerLabel(a.owner)}</span></td>
      <td style="color:var(--muted);font-size:0.75rem">${a.macro_engine || "-"}</td>
      <td><span class="badge ${tierClass(a.cost_tier)}">${a.cost_tier || "-"}</span></td>
      <td style="color:var(--muted);font-size:0.75rem">${a.model || "-"}</td>
      <td style="color:var(--muted);text-align:center">${a.tools_count !== undefined ? a.tools_count : 0}</td>
      <td><div class="agent-desc">${a.description}</div></td>
    </tr>
  `).join("");

  cards.innerHTML = data.map(a => `
    <div class="card">
      <div class="card-name">${a.name}</div>
      <div class="card-desc">${a.description}</div>
      <div class="card-meta">
        <span class="owner-chip">${ownerLabel(a.owner)}</span>
        <span class="badge ${tierClass(a.cost_tier)}">${a.cost_tier || "-"}</span>
        ${a.model ? `<span style="color:var(--muted);font-size:0.7rem">${a.model}</span>` : ""}
        ${a.tools_count ? `<span style="color:var(--muted);font-size:0.7rem">${a.tools_count} tools</span>` : ""}
      </div>
    </div>
  `).join("");
}

function setupHeaders() {
  document.querySelectorAll("th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      document.querySelectorAll("th[data-col]").forEach(h => {
        h.classList.remove("sorted");
        h.querySelector(".sort-arrow").innerHTML = "&#8595;";
      });
      th.classList.add("sorted");
      th.querySelector(".sort-arrow").innerHTML = sortAsc ? "&#8593;" : "&#8595;";
      render();
    });
  });
}

function setupOwnerChips() {
  const owners = [...new Set(RAW.map(a => a.owner || "janis"))].sort();
  const container = document.getElementById("owner-chips");
  const all = document.createElement("span");
  all.className = "chip active";
  all.textContent = "All";
  all.addEventListener("click", () => {
    activeOwner = "";
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    all.classList.add("active");
    render();
  });
  container.appendChild(all);
  owners.forEach(o => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = o.charAt(0).toUpperCase() + o.slice(1);
    chip.addEventListener("click", () => {
      activeOwner = o;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      render();
    });
    container.appendChild(chip);
  });
}

document.getElementById("ts-label").textContent = "Built 2026-09-04 20:47 CET";
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

setupHeaders();
setupOwnerChips();
render();
</script>
