<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGL Knowledge Graph | Mexzungu Group</title>
  <meta name="description" content="Force-directed knowledge graph of the MGL operating system: 29 personas, loops, and tools.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --pink: #e14b87;
      --pink-light: #e86fa0;
      --blue: #4c9fff;
      --amber: #f0a030;
      --bg: #0d0d0d;
      --surface: #181818;
      --surface2: #222222;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --heading: 'RocknRoll One', 'Space Grotesk', sans-serif;
      --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    a { color: var(--pink); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--pink-light); }

    nav { position: relative; z-index: 100; background: rgba(13,13,13,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
    .nav-logo { font-family: var(--heading); font-weight: 700; color: #e8e8e8; font-size: 14px; }
    .nav-logo span { color: var(--pink); }
    .nav-sep { color: var(--border); }
    .nav-link { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 4px; transition: color .15s, background .15s; }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.active { color: var(--pink); }

    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; }

    /* Controls overlay */
    #controls { position: absolute; top: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; gap: 10px; width: 200px; }
    .ctrl-panel { background: rgba(24,24,24,0.92); border: 1px solid var(--border); border-radius: 10px; padding: 14px; backdrop-filter: blur(8px); }
    .ctrl-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; }
    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .filter-label { font-size: 12px; color: var(--text); flex: 1; }
    .filter-count { font-size: 11px; color: var(--muted); }
    .filter-row input[type=checkbox] { display: none; }
    .filter-row.dimmed .filter-label { color: var(--muted); }
    .filter-row.dimmed .filter-dot { opacity: 0.3; }

    /* Search */
    #search-wrap { position: absolute; top: 16px; left: 16px; z-index: 50; width: 220px; }
    #search { width: 100%; background: rgba(24,24,24,0.92); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-size: 13px; color: var(--text); font-family: var(--sans); outline: none; backdrop-filter: blur(8px); transition: border-color 0.2s; }
    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--pink); }
    #search-count { font-size: 11px; color: var(--muted); margin-top: 6px; padding-left: 2px; }

    /* Tooltip */
    #tooltip { position: absolute; pointer-events: none; background: rgba(24,24,24,0.96); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5; max-width: 200px; z-index: 200; display: none; }
    #tooltip .tt-name { font-family: var(--heading); font-size: 13px; color: var(--text); margin-bottom: 2px; }
    #tooltip .tt-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    #tooltip .tt-type.persona { color: var(--pink); }
    #tooltip .tt-type.loop { color: var(--blue); }
    #tooltip .tt-type.tool { color: var(--amber); }
    #tooltip .tt-title { font-size: 11px; color: var(--muted); margin-top: 3px; }
    #tooltip .tt-engine { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* Legend */
    #legend { position: absolute; bottom: 16px; left: 16px; z-index: 50; }
    .legend-panel { background: rgba(24,24,24,0.88); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(8px); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .leg-item { display: flex; align-items: center; gap: 6px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .leg-label { font-size: 11px; color: var(--muted); }

    /* Edge type legend */
    #edge-legend { position: absolute; bottom: 16px; right: 16px; z-index: 50; }

    @media (max-width: 640px) {
      #controls { width: 160px; right: 8px; top: 8px; }
      #search-wrap { width: 160px; left: 8px; top: 8px; }
      .ctrl-panel { padding: 10px; }
      #legend { bottom: 8px; left: 8px; }
      .legend-panel { gap: 10px; padding: 8px 10px; }
    }
  </style>
</head>

  </div>

  <div id="legend">

</div>

// Node style maps
const NODE_COLOR = { persona: '#e14b87', loop: '#4c9fff', tool: '#f0a030' };
const NODE_RADIUS = { persona: 12, loop: 7, tool: 5 };
const EDGE_COLOR = { 'owns': '#555', 'reports-to': '#e14b87aa', 'triggers': '#4c9fff33', 'feeds-into': '#f0a03033' };

// State
const visibleTypes = { persona: true, loop: true, tool: true };
let searchQuery = '';

// Update counts
const typeCounts = {};
NODES.forEach(n => { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });
['persona','loop','tool'].forEach(t => {
  const el = document.getElementById('count-' + t);
  if (el) el.textContent = typeCounts[t] || 0;
});

// SVG setup
const svg = d3.select('#graph-svg');
const wrap = document.getElementById('canvas-wrap');
let W = wrap.clientWidth, H = wrap.clientHeight;

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Arrow marker
svg.append('defs').append('marker')
  .attr('id', 'arrow')
  .attr('viewBox', '0 -4 8 8')
  .attr('refX', 18)
  .attr('refY', 0)
  .attr('markerWidth', 5)
  .attr('markerHeight', 5)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-4L8,0L0,4')
  .attr('fill', '#555');

// Build graph
let nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = n);

let linkSel, nodeSel, labelSel;

function getVisibleNodes() {
  const q = searchQuery.toLowerCase();
  return NODES.filter(n => {
    if (!visibleTypes[n.type]) return false;
    if (q && !n.name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function getVisibleEdges(visNodes) {
  const ids = new Set(visNodes.map(n => n.id));
  return EDGES.filter(e => ids.has(e.source.id || e.source) && ids.has(e.target.id || e.target));
}

// Simulation
const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(d => {
    if (d.source.type === 'persona' && d.target.type === 'persona') return 100;
    return 60;
  }))
  .force('charge', d3.forceManyBody().strength(d => {
    if (d.type === 'persona') return -250;
    if (d.type === 'loop') return -80;
    return -40;
  }))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collide', d3.forceCollide().radius(d => NODE_RADIUS[d.type] + 4))
  .on('tick', ticked);

function initGraph() {
  g.selectAll('*').remove();

  const visNodes = getVisibleNodes();
  const visEdges = getVisibleEdges(visNodes);

  // Update search count
  const sc = document.getElementById('search-count');
  if (searchQuery) {
    sc.textContent = visNodes.length + ' of ' + NODES.length + ' shown';
  } else {
    sc.textContent = '';
  }

  linkSel = g.append('g').attr('class', 'links')
    .selectAll('line')
    .data(visEdges)
    .join('line')
    .attr('stroke', d => EDGE_COLOR[d.type] || '#444')
    .attr('stroke-width', d => d.type === 'reports-to' ? 1.5 : 1)
    .attr('marker-end', d => d.type === 'reports-to' ? 'url(#arrow)' : null)
    .attr('opacity', 0.7);

  nodeSel = g.append('g').attr('class', 'nodes')
    .selectAll('circle')
    .data(visNodes)
    .join('circle')
    .attr('r', d => NODE_RADIUS[d.type])
    .attr('fill', d => NODE_COLOR[d.type])
    .attr('stroke', '#0d0d0d')
    .attr('stroke-width', 1.5)
    .attr('opacity', d => searchQuery && !d.name.toLowerCase().includes(searchQuery.toLowerCase()) ? 0.15 : 1)
    .style('cursor', d => d.url ? 'pointer' : 'default')
    .on('mouseover', showTooltip)
    .on('mousemove', moveTooltip)
    .on('mouseout', hideTooltip)
    .on('click', (e, d) => { if (d.url) window.open(d.url, '_blank'); })
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragged)
      .on('end', dragEnd));

  // Labels only for personas
  labelSel = g.append('g').attr('class', 'labels')
    .selectAll('text')
    .data(visNodes.filter(n => n.type === 'persona'))
    .join('text')
    .text(d => d.name)
    .attr('font-size', '10px')
    .attr('font-family', "'Space Grotesk', sans-serif")
    .attr('fill', '#ccc')
    .attr('text-anchor', 'middle')
    .attr('dy', d => NODE_RADIUS[d.type] + 12)
    .attr('pointer-events', 'none');

  simulation.nodes(visNodes);
  simulation.force('link').links(visEdges);
  simulation.alpha(0.6).restart();
}

function ticked() {
  if (linkSel) {
    linkSel
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
  }
  if (nodeSel) {
    nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  }
  if (labelSel) {
    labelSel.attr('x', d => d.x).attr('y', d => d.y);
  }
}

function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Tooltip
const tt = document.getElementById('tooltip');
function showTooltip(e, d) {
  tt.querySelector('.tt-name').textContent = d.name;
  const typeEl = tt.querySelector('.tt-type');
  typeEl.textContent = d.type;
  typeEl.className = 'tt-type ' + d.type;
  const titleEl = tt.querySelector('.tt-title');
  titleEl.textContent = d.title || (d.type === 'loop' ? 'Automation loop' : '');
  const engEl = tt.querySelector('.tt-engine');
  engEl.textContent = d.macro_engine ? 'Engine: ' + d.macro_engine : '';
  tt.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const x = e.offsetX + 14, y = e.offsetY - 10;
  tt.style.left = Math.min(x, W - 220) + 'px';
  tt.style.top = Math.max(y, 10) + 'px';
}
function hideTooltip() { tt.style.display = 'none'; }

// Filters
document.querySelectorAll('.filter-row input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', () => {
    const type = cb.dataset.type;
    visibleTypes[type] = cb.checked;
    cb.closest('.filter-row').classList.toggle('dimmed', !cb.checked);
    initGraph();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  initGraph();
});

// Resize
window.addEventListener('resize', () => {
  W = wrap.clientWidth; H = wrap.clientHeight;
  simulation.force('center', d3.forceCenter(W / 2, H / 2));
  simulation.alpha(0.1).restart();
});

// Init
initGraph();

// Fit on first stable tick
simulation.on('end', () => {
  const ns = simulation.nodes();
  if (!ns.length) return;
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 60;
  const scaleX = (W - pad*2) / (maxX - minX || 1);
  const scaleY = (H - pad*2) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY, 2);
  const tx = W/2 - scale * (minX + maxX) / 2;
  const ty = H/2 - scale * (minY + maxY) / 2;
  svg.transition().duration(800).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
});
