<body>
<canvas id="particle-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
<script>
document.addEventListener('DOMContentLoaded',function(){(function(){
  var c=document.getElementById('particle-canvas'),ctx=c.getContext('2d'),W,H,mouse={x:0,y:0};
  var COLORS=['rgba(100,140,255,.25)','rgba(225,75,135,.12)'];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  var pts=[];
  for(var i=0;i<80;i++){pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:1+Math.random(),col:COLORS[Math.random()<.6?0:1]});}
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      p.vx+=(mouse.x-p.x)*.0001;p.vy+=(mouse.y-p.y)*.0001;
      p.x+=p.vx;p.y+=p.vy;
      p.vx*=.99;p.vy*=.99;
      if(p.x<0){p.x=0;p.vx*=-1;}if(p.x>W){p.x=W;p.vx*=-1;}
      if(p.y<0){p.y=0;p.vy*=-1;}if(p.y>H){p.y=H;p.vy*=-1;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<100){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='rgba(100,140,255,.05)';ctx.lineWidth=.5;ctx.stroke();}
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();});
</script>

<script src="/graph/d3.v7.min.js"></script>
<script>
(function () {
  'use strict';

  var allNodes = [], allEdges = [], collabEdges = [];
  var currentMode = 'org';
  var currentDepth = 1;
  var selectedNode = null;

  var svgSel, gEl, zoomBeh, sim;
  var gHulls, gGlow, gCollab, gWorkflow, gFg, gNodes;
  var hullsVisible = true;
  var _hullTickN = 0;
  var currentEngineFilter = null;

  var C = { persona: '#e14b87', loop: '#4c9fff', tool: '#00d4aa' };

  var ENGINE_COLORS = {
    'Connection': { color: '#e14b87', fillOp: 0.06, strokeOp: 0.25 },
    'Value':      { color: '#4c9fff', fillOp: 0.06, strokeOp: 0.25 },
    'Care':       { color: '#00d4aa', fillOp: 0.06, strokeOp: 0.25 },
    'Core':       { color: '#888888', fillOp: 0.04, strokeOp: 0.15 },
    'Body':       { color: '#ff9f43', fillOp: 0.06, strokeOp: 0.20 },
    'Mind':       { color: '#a29bfe', fillOp: 0.06, strokeOp: 0.20 },
    'Soul':       { color: '#fd79a8', fillOp: 0.06, strokeOp: 0.20 },
  };

  var RADIUS = {
    org:  { persona: 22, loop: 0, tool: 0 },
    ops:  { persona: 14, loop: 7, tool: 0 },
    full: { persona: 13, loop: 6, tool: 4 },
  };

  function nr(node) { return RADIUS[currentMode][node.type] || 0; }
  function visible(node) { return nr(node) > 0; }

  function structEdgeVisible(e) {
    if (currentMode === 'org')  return e.type === 'reports-to';
    if (currentMode === 'ops')  return e.type === 'reports-to' || e.type === 'owns';
    return true;
  }

  function sid(e, which) {
    var v = e[which];
    return typeof v === 'object' ? v.id : v;
  }

  function eKey(e) { return sid(e,'source') + '|' + sid(e,'target') + '|' + e.type; }

  function bfs(startId, depth, edges) {
    var visited = new Set([startId]);
    var frontier = [startId];
    for (var hop = 0; hop < depth; hop++) {
      var next = [];
      for (var i = 0; i < frontier.length; i++) {
        var id = frontier[i];
        for (var j = 0; j < edges.length; j++) {
          var e = edges[j];
          var s = sid(e,'source'), t = sid(e,'target');
          if (s === id && !visited.has(t)) { visited.add(t); next.push(t); }
          if (t === id && !visited.has(s)) { visited.add(s); next.push(s); }
        }
      }
      frontier = next;
      if (!frontier.length) break;
    }
    return visited;
  }

  function nodeById(id) { return allNodes.find(function(n) { return n.id === id; }); }

  function init(nodes, edges, collab) {
    allNodes    = nodes;
    allEdges    = edges;
    collabEdges = collab;

    var W = window.innerWidth;
    var H = window.innerHeight - 52;

    svgSel = d3.select('#graph').attr('width', W).attr('height', H);

    var defs = svgSel.append('defs');
    addGlow(defs, 'glow-pink',   '#e14b87', 10);
    addGlow(defs, 'glow-pink-s', '#e14b87',  4);
    addGlow(defs, 'glow-blue',   '#4c9fff',  6);
    addGrad(defs, 'g-persona', '#4a1a30', '#1a0a18');
    addGrad(defs, 'g-loop',    '#0d2040', '#060e1c');
    addGrad(defs, 'g-tool',    '#0a2420', '#060e0c');
    addArrow(defs, 'arr-pink', '#e14b87', 12);
    addArrow(defs, 'arr-blue', '#4c9fff', 12);
    addArrow(defs, 'arr-teal', '#00d4aa', 10);

    zoomBeh = d3.zoom().scaleExtent([0.05, 5]).on('zoom', function(ev) {
      gEl.attr('transform', ev.transform);
    });
    svgSel.call(zoomBeh);
    svgSel.on('click', function(ev) {
      if (ev.target === svgSel.node()) deselect();
    });

    gEl       = svgSel.append('g').attr('class', 'main-g');
    gHulls    = gEl.append('g').attr('class', 'g-hulls');
    gGlow     = gEl.append('g');
    gCollab   = gEl.append('g');
    gWorkflow = gEl.append('g');
    gFg       = gEl.append('g');
    gNodes    = gEl.append('g');

    sim = d3.forceSimulation()
      .force('link', d3.forceLink().id(function(d) { return d.id; })
        .distance(function(d) {
          if (d.type === 'reports-to') return 90;
          if (d.type === 'owns') return 120;
          return 160;
        })
        .strength(0.4))
      .force('charge', d3.forceManyBody().strength(-280).distanceMax(380))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('collide', d3.forceCollide().radius(function(d) { return nr(d) + 5; }).iterations(2))
      .on('tick', tick);

    renderMode();
    bindUI();

    sim.on('end.autofit', function() {
      autoFit(W, H);
      sim.on('end.autofit', null);
    });

    sim.on('end.hulls', function() { updateHulls(); });

    document.getElementById('loading').style.display = 'none';
  }

  function addGlow(defs, id, hex, std) {
    var f = defs.append('filter').attr('id', id)
      .attr('x','-60%').attr('y','-60%').attr('width','220%').attr('height','220%');
    f.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation', std).attr('result','b');
    var ri = function(h, o) { return parseInt(h.slice(o, o+2), 16) / 255; };
    f.append('feColorMatrix').attr('in','b').attr('type','matrix')
      .attr('values', '0 0 0 0 '+ri(hex,1)+'  0 0 0 0 '+ri(hex,3)+'  0 0 0 0 '+ri(hex,5)+'  0 0 0 0.85 0')
      .attr('result','cb');
    var m = f.append('feMerge');
    m.append('feMergeNode').attr('in','cb');
    m.append('feMergeNode').attr('in','SourceGraphic');
  }

  function addGrad(defs, id, c0, c1) {
    var g = defs.append('radialGradient').attr('id', id)
      .attr('cx','40%').attr('cy','35%').attr('r','65%');
    g.append('stop').attr('offset','0%').attr('stop-color', c0);
    g.append('stop').attr('offset','100%').attr('stop-color', c1);
  }

  function addArrow(defs, id, color, refX) {
    defs.append('marker').attr('id', id)
      .attr('viewBox','0 -5 10 10').attr('refX', refX).attr('refY', 0)
      .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5').attr('fill', color).attr('opacity', .85);
  }

  function renderMode() {
    var visNodes = allNodes.filter(visible);
    var visIds   = new Set(visNodes.map(function(n) { return n.id; }));

    var visEdges = allEdges.filter(function(e) {
      if (!structEdgeVisible(e)) return false;
      return visIds.has(sid(e,'source')) && visIds.has(sid(e,'target'));
    });

    var showCollab = currentMode === 'full';

    sim.nodes(visNodes);
    var linkArr = showCollab ? visEdges.concat(collabEdges) : visEdges;
    sim.force('link').links(linkArr);
    sim.force('collide').radius(function(d) { return nr(d) + 5; });

    drawEdges(visEdges, showCollab);
    drawNodes(visNodes);
    sim.alpha(0.6).restart();
    _hullTickN = 0;
    updateHulls();
    updateEngineChips();
    applyEngineFilter();
  }

  function drawEdges(structEdges, showCollab) {
    var rtEdges  = structEdges.filter(function(e) { return e.type === 'reports-to'; });
    var ownEdges = structEdges.filter(function(e) { return e.type === 'owns'; });
    var glowSet  = rtEdges.concat(ownEdges);

    gGlow.selectAll('line').data(glowSet, eKey).join(
      function(enter) {
        return enter.append('line')
          .attr('fill','none').attr('stroke-linecap','round').attr('pointer-events','none')
          .attr('stroke', function(d) { return d.type === 'reports-to' ? '#e14b87' : '#4c9fff'; })
          .attr('stroke-width', function(d) { return d.type === 'reports-to' ? 7 : 6; })
          .attr('stroke-opacity', .12)
          .attr('filter', function(d) { return d.type === 'reports-to' ? 'url(#glow-pink-s)' : 'url(#glow-blue)'; });
      },
      function(update) {
        return update.attr('stroke', function(d) { return d.type === 'reports-to' ? '#e14b87' : '#4c9fff'; });
      },
      function(exit) { return exit.remove(); }
    );

    gFg.selectAll('line').data(glowSet, eKey).join(
      function(enter) {
        return enter.append('line')
          .attr('fill','none').attr('stroke-linecap','round').attr('pointer-events','none')
          .attr('stroke', function(d) { return d.type === 'reports-to' ? '#e14b87' : '#4c9fff'; })
          .attr('stroke-width', function(d) { return d.type === 'reports-to' ? 2 : 1.5; })
          .attr('stroke-opacity', function(d) { return d.type === 'reports-to' ? .9 : .75; })
          .attr('marker-end', function(d) { return d.type === 'reports-to' ? 'url(#arr-pink)' : 'url(#arr-blue)'; });
      },
      function(update) { return update; },
      function(exit) { return exit.remove(); }
    );

    var collabSolid = showCollab ? collabEdges.filter(function(e) { return e.type === 'collaborates'; }) : [];
    gCollab.selectAll('line').data(collabSolid, eKey).join(
      function(enter) {
        return enter.append('line')
          .attr('fill','none').attr('stroke','rgba(0,212,170,.38)').attr('stroke-width',1)
          .attr('stroke-linecap','round').attr('pointer-events','none');
      },
      function(update) { return update; },
      function(exit) { return exit.remove(); }
    );

    var wfEdges = showCollab ? collabEdges.filter(function(e) { return e.type === 'workflow'; }) : [];
    gWorkflow.selectAll('line').data(wfEdges, eKey).join(
      function(enter) {
        return enter.append('line').attr('class','edge-workflow').attr('marker-end','url(#arr-teal)');
      },
      function(update) { return update; },
      function(exit) { return exit.remove(); }
    );
  }

  function drawNodes(visNodes) {
    var isOrg = currentMode === 'org';

    gNodes.selectAll('g.nd').data(visNodes, function(d) { return d.id; }).join(
      function(enter) {
        var g = enter.append('g').attr('class','nd').style('cursor','pointer');

        g.filter(function(d) { return d.type === 'persona'; }).append('circle')
          .attr('class','pr').attr('fill','none').attr('stroke','#e14b87')
          .attr('stroke-width',1).attr('opacity',0)
          .attr('r', function(d) { return nr(d) + 10; });
        g.filter(function(d) { return d.type === 'persona'; }).append('circle')
          .attr('class','pr2').attr('fill','none').attr('stroke','#e14b87')
          .attr('stroke-width',.5).attr('opacity',0)
          .attr('r', function(d) { return nr(d) + 18; });

        g.append('circle').attr('class','outer')
          .attr('r', function(d) { return nr(d) + 2; })
          .attr('fill','none')
          .attr('stroke', function(d) { return C[d.type] || '#888'; })
          .attr('stroke-width', .6).attr('stroke-opacity', .25);

        g.append('circle').attr('class','body')
          .attr('r', function(d) { return nr(d); })
          .attr('fill', function(d) { return 'url(#g-' + d.type + ')'; })
          .attr('stroke', function(d) { return C[d.type] || '#888'; })
          .attr('stroke-width', 1.5);

        g.append('text').attr('class','lbl')
          .attr('text-anchor','middle').attr('dominant-baseline','central')
          .attr('pointer-events','none');

        g.on('click', function(ev, d) { ev.stopPropagation(); selectNode(d); })
          .call(d3.drag()
            .on('start', function(ev, d) { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag',  function(ev, d) { d.fx = ev.x; d.fy = ev.y; })
            .on('end',   function(ev, d) { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
          );

        return g;
      },
      function(update) { return update; },
      function(exit) { return exit.remove(); }
    );

    var ndSel = gNodes.selectAll('g.nd');

    ndSel.select('circle.pr').attr('r', function(d) { return nr(d) + 10; });
    ndSel.select('circle.pr2').attr('r', function(d) { return nr(d) + 18; });
    ndSel.select('circle.outer')
      .attr('r', function(d) { return nr(d) + 2; })
      .attr('stroke', function(d) { return C[d.type] || '#888'; });
    ndSel.select('circle.body')
      .attr('r', function(d) { return nr(d); })
      .attr('stroke', function(d) { return C[d.type] || '#888'; })
      .attr('filter', function(d) {
        if (d.type === 'persona') return isOrg ? 'url(#glow-pink)' : 'url(#glow-pink-s)';
        if (d.type === 'loop')   return 'url(#glow-blue)';
        return null;
      });

    ndSel.select('text.lbl')
      .attr('dy', function(d) { return nr(d) + (isOrg && d.type === 'persona' ? 14 : 10); })
      .attr('font-size', function(d) { return isOrg && d.type === 'persona' ? '12' : '9'; })
      .attr('font-weight', isOrg ? '700' : '500')
      .attr('fill', function(d) { return d.type === 'persona' ? '#e8f0ff' : 'rgba(200,216,240,.55)'; })
      .text(function(d) {
        if (d.type === 'persona') return d.name || d.id;
        if (nr(d) >= 6) return d.name || d.id;
        return '';
      });
  }

  function calcPts(d, arrowOff) {
    var sx = d.source.x || 0, sy = d.source.y || 0;
    var tx = d.target.x || 0, ty = d.target.y || 0;
    var dx = tx - sx, dy = ty - sy;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var sr = (RADIUS[currentMode][d.source.type] || 4) + 1;
    var tr = (RADIUS[currentMode][d.target.type] || 4) + (arrowOff || 1);
    return [sx+(dx/len)*sr, sy+(dy/len)*sr, tx-(dx/len)*tr, ty-(dy/len)*tr];
  }

  function tick() {
    gGlow.selectAll('line')
      .attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
      .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });

    gFg.selectAll('line').each(function(d) {
      var p = calcPts(d, 8);
      d3.select(this).attr('x1',p[0]).attr('y1',p[1]).attr('x2',p[2]).attr('y2',p[3]);
    });

    gCollab.selectAll('line')
      .attr('x1', function(d) { return d.source.x||0; }).attr('y1', function(d) { return d.source.y||0; })
      .attr('x2', function(d) { return d.target.x||0; }).attr('y2', function(d) { return d.target.y||0; });

    gWorkflow.selectAll('line').each(function(d) {
      var p = calcPts(d, 6);
      d3.select(this).attr('x1',p[0]).attr('y1',p[1]).attr('x2',p[2]).attr('y2',p[3]);
    });

    gNodes.selectAll('g.nd')
      .attr('transform', function(d) { return 'translate('+(d.x||0)+','+(d.y||0)+')'; });

    _hullTickN++;
    if (_hullTickN % 10 === 0) updateHulls();
  }

  function updateHulls() {
    if (!gHulls) return;
    if (!hullsVisible) { gHulls.selectAll('*').remove(); return; }

    var visNodes = sim.nodes();
    var PAD = 32;

    var groups = {};
    for (var i = 0; i < visNodes.length; i++) {
      var d = visNodes[i];
      var eng = d.macro_engine;
      if (!eng || !ENGINE_COLORS[eng]) continue;
      if (!groups[eng]) groups[eng] = [];
      groups[eng].push(d);
    }

    var engines      = Object.keys(groups);
    var hullEngines  = engines.filter(function(e) { return groups[e].length >= 3; });
    var smallEngines = engines.filter(function(e) { return groups[e].length < 3; });

    gHulls.selectAll('path.hull').data(hullEngines, function(e) { return e; }).join(
      function(enter) {
        return enter.append('path').attr('class', 'hull')
          .attr('stroke-width', 1.5).attr('stroke-linejoin', 'round').attr('pointer-events', 'none');
      },
      function(update) { return update; },
      function(exit)   { return exit.remove(); }
    )
    .attr('fill',         function(e) { return ENGINE_COLORS[e].color; })
    .attr('fill-opacity', function(e) { return ENGINE_COLORS[e].fillOp; })
    .attr('stroke',       function(e) { return ENGINE_COLORS[e].color; })
    .attr('stroke-opacity', function(e) { return ENGINE_COLORS[e].strokeOp; })
    .attr('d', function(e) {
      var pts  = groups[e].map(function(d) { return [d.x || 0, d.y || 0]; });
      var hull = d3.polygonHull(pts);
      if (!hull) return null;
      var cx = 0, cy = 0;
      for (var k = 0; k < hull.length; k++) { cx += hull[k][0]; cy += hull[k][1]; }
      cx /= hull.length; cy /= hull.length;
      var padded = hull.map(function(p) {
        var dx = p[0] - cx, dy = p[1] - cy;
        var len = Math.sqrt(dx*dx + dy*dy) || 1;
        return [p[0] + dx/len*PAD, p[1] + dy/len*PAD];
      });
      return 'M' + padded.map(function(p) { return p[0].toFixed(1)+','+p[1].toFixed(1); }).join('L') + 'Z';
    });

    gHulls.selectAll('circle.hull-c').data(smallEngines, function(e) { return e; }).join(
      function(enter) {
        return enter.append('circle').attr('class', 'hull-c')
          .attr('stroke-width', 1.5).attr('pointer-events', 'none');
      },
      function(update) { return update; },
      function(exit)   { return exit.remove(); }
    )
    .attr('fill',         function(e) { return ENGINE_COLORS[e].color; })
    .attr('fill-opacity', function(e) { return ENGINE_COLORS[e].fillOp; })
    .attr('stroke',       function(e) { return ENGINE_COLORS[e].color; })
    .attr('stroke-opacity', function(e) { return ENGINE_COLORS[e].strokeOp; })
    .attr('cx', function(e) {
      var ns = groups[e], cx = 0;
      ns.forEach(function(d) { cx += d.x || 0; });
      return cx / ns.length;
    })
    .attr('cy', function(e) {
      var ns = groups[e], cy = 0;
      ns.forEach(function(d) { cy += d.y || 0; });
      return cy / ns.length;
    })
    .attr('r', function(e) {
      var ns = groups[e];
      if (ns.length === 1) return PAD + 20;
      var dx = (ns[1].x||0) - (ns[0].x||0), dy = (ns[1].y||0) - (ns[0].y||0);
      return Math.sqrt(dx*dx + dy*dy) / 2 + PAD;
    });

    gHulls.selectAll('text.hull-label').data(engines, function(e) { return e; }).join(
      function(enter) {
        return enter.append('text').attr('class', 'hull-label')
          .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
          .attr('font-size', '11').attr('font-weight', '600').attr('letter-spacing', '2')
          .attr('pointer-events', 'none').style('text-transform', 'uppercase');
      },
      function(update) { return update; },
      function(exit)   { return exit.remove(); }
    )
    .attr('fill',         function(e) { return ENGINE_COLORS[e].color; })
    .attr('fill-opacity', 0.5)
    .attr('x', function(e) {
      var ns = groups[e], cx = 0;
      ns.forEach(function(d) { cx += d.x || 0; });
      return cx / ns.length;
    })
    .attr('y', function(e) {
      var ns = groups[e], cy = 0;
      ns.forEach(function(d) { cy += d.y || 0; });
      return cy / ns.length;
    })
    .text(function(e) { return e.toUpperCase(); });

    applyEngineFilterToHulls();
  }

  function selectNode(node) {
    selectedNode = node;
    var bfsEdges = currentMode === 'full'
      ? allEdges.concat(collabEdges)
      : allEdges.filter(structEdgeVisible);
    var reached = bfs(node.id, currentDepth, bfsEdges);

    function inSet(d) {
      return reached.has(sid(d,'source')) && reached.has(sid(d,'target'));
    }

    gNodes.selectAll('g.nd').style('opacity', function(d) { return reached.has(d.id) ? 1 : .12; });
    gFg.selectAll('line').style('opacity', function(d) { return inSet(d) ? 1 : .04; });
    gGlow.selectAll('line').style('opacity', function(d) { return inSet(d) ? 1 : .02; });
    gCollab.selectAll('line').style('opacity', function(d) { return inSet(d) ? 1 : .04; });
    gWorkflow.selectAll('line').style('opacity', function(d) { return inSet(d) ? 1 : .04; });

    openPanel(node);
  }

  function deselect() {
    selectedNode = null;
    gNodes.selectAll('g.nd').style('opacity', 1);
    gFg.selectAll('line').style('opacity', null);
    gGlow.selectAll('line').style('opacity', null);
    gCollab.selectAll('line').style('opacity', null);
    gWorkflow.selectAll('line').style('opacity', null);
    applyEngineFilter();
    closePanel();
  }

  function openPanel(node) {
    document.getElementById('panel-name').textContent = node.name || node.id;
    document.getElementById('depth-controls').style.display =
      currentMode === 'org' ? 'none' : 'flex';

    var mh = '<div class="meta-row"><div class="meta-key">Type</div>' +
             '<div class="meta-value"><span class="type-badge '+node.type+'">'+node.type+'</span></div></div>';
    if (node.title)       mh += mRow('Role',   node.title);
    if (node.owner)       mh += mRow('Owner',  node.owner);
    if (node.macro_engine && node.macro_engine !== '') mh += mRow('Engine', node.macro_engine);
    document.getElementById('panel-meta').innerHTML = mh;

    var manages=[], reportsTo=[], owns=[], collab=[], wflow=[];

    for (var i = 0; i < allEdges.length; i++) {
      var e = allEdges[i];
      var s = sid(e,'source'), t = sid(e,'target');
      if (e.type === 'reports-to') {
        if (t === node.id) manages.push({ id:s, node:nodeById(s) });
        if (s === node.id) reportsTo.push({ id:t, node:nodeById(t) });
      }
      if (e.type === 'owns' && s === node.id) owns.push({ id:t, node:nodeById(t) });
    }
    for (var j = 0; j < collabEdges.length; j++) {
      var ce = collabEdges[j];
      var cs = sid(ce,'source'), ct = sid(ce,'target');
      if (cs === node.id || ct === node.id) {
        var oid = cs === node.id ? ct : cs;
        if (ce.type === 'collaborates') collab.push({ id:oid, node:nodeById(oid) });
        if (ce.type === 'workflow')     wflow.push({ id:oid, node:nodeById(oid), label:ce.label });
      }
    }

    var total = manages.length + reportsTo.length + owns.length + collab.length + wflow.length;
    document.getElementById('panel-degree-badge').textContent =
      total + ' connection' + (total !== 1 ? 's' : '');

    var ch = '';
    if (manages.length)   ch += cGroup('Manages',      manages,   'reports-to',   false);
    if (reportsTo.length) ch += cGroup('Reports to',   reportsTo, 'reports-to',   false);
    if (owns.length)      ch += cGroup('Owns',          owns,      'owns',         false);
    if (collab.length)    ch += cGroup('Collaborates',  collab,    'collaborates', false);
    if (wflow.length)     ch += cGroup('Workflow',      wflow,     'workflow',     true);
    if (!ch) ch = '<div style="font-size:12px;color:rgba(200,216,240,.28)">No connections</div>';
    document.getElementById('panel-connections').innerHTML = ch;

    document.querySelectorAll('.conn-item[data-id]').forEach(function(el) {
      el.addEventListener('click', function() {
        var n = nodeById(el.dataset.id);
        if (n) selectNode(n);
      });
    });

    var ll = document.getElementById('panel-library-link');
    if (node.url && node.url.trim()) {
      ll.href = node.url.startsWith('http') ? node.url : 'https://mexzungu.com' + node.url;
      ll.style.display = 'block';
    } else {
      ll.style.display = 'none';
    }

    document.getElementById('detail-panel').classList.add('open');
  }

  function closePanel() {
    document.getElementById('detail-panel').classList.remove('open');
  }

  function mRow(key, val) {
    return '<div class="meta-row"><div class="meta-key">'+key+'</div><div class="meta-value">'+val+'</div></div>';
  }

  function cGroup(title, items, dotCls, showLabel) {
    var h = '<div class="conn-group"><div class="conn-group-title">'+title+'</div>';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var nm = item.node ? (item.node.name || item.node.id) : item.id;
      h += '<div class="conn-item" data-id="'+item.id+'">' +
           '<div class="conn-dot '+dotCls+'"></div>' +
           '<span class="conn-name">'+nm+'</span>' +
           (showLabel && item.label ? '<span class="conn-label">'+item.label+'</span>' : '') +
           '</div>';
    }
    return h + '</div>';
  }

  function autoFit(W, H) {
    var b = gEl.node().getBBox();
    if (!b.width || !b.height) return;
    var pad = 70;
    var scale = Math.min((W-pad*2)/b.width, (H-pad*2)/b.height, 1.4);
    svgSel.transition().duration(900).call(
      zoomBeh.transform,
      d3.zoomIdentity
        .translate(W/2, H/2).scale(scale)
        .translate(-(b.x + b.width/2), -(b.y + b.height/2))
    );
  }

  function hexToRgbStr(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return r+','+g+','+b;
  }

  function applyEngineFilterToHulls() {
    if (!gHulls) return;
    if (!currentEngineFilter) {
      gHulls.selectAll('path.hull').style('opacity', null);
      gHulls.selectAll('circle.hull-c').style('opacity', null);
      gHulls.selectAll('text.hull-label').style('opacity', null);
    } else {
      gHulls.selectAll('path.hull').style('opacity', function(e) { return e === currentEngineFilter ? null : 0; });
      gHulls.selectAll('circle.hull-c').style('opacity', function(e) { return e === currentEngineFilter ? null : 0; });
      gHulls.selectAll('text.hull-label').style('opacity', function(e) { return e === currentEngineFilter ? null : 0; });
    }
  }

  function applyEngineFilter() {
    if (!selectedNode) {
      if (!currentEngineFilter) {
        gNodes.selectAll('g.nd').style('opacity', 1);
      } else {
        gNodes.selectAll('g.nd').style('opacity', function(d) {
          return d.macro_engine === currentEngineFilter ? 1 : 0.06;
        });
      }
    }
    applyEngineFilterToHulls();
  }

  function updateEngineChips() {
    var visNodes = allNodes.filter(visible);
    var visEngines = new Set(visNodes.map(function(n) { return n.macro_engine; }).filter(Boolean));
    document.querySelectorAll('.engine-chip[data-engine]').forEach(function(chip) {
      var eng = chip.dataset.engine;
      if (eng === 'all') { chip.style.display = ''; return; }
      chip.style.display = visEngines.has(eng) ? '' : 'none';
    });
    if (currentEngineFilter && !visEngines.has(currentEngineFilter)) {
      currentEngineFilter = null;
      document.querySelectorAll('.engine-chip').forEach(function(c) {
        c.classList.remove('active'); c.style.color = ''; c.style.background = '';
      });
      var allChip = document.querySelector('.engine-chip[data-engine="all"]');
      if (allChip) {
        allChip.classList.add('active');
        allChip.style.color = '#e14b87';
        allChip.style.background = 'rgba(225,75,135,.12)';
      }
    }
  }

  function bindUI() {
    document.querySelectorAll('.pill').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var mode = btn.dataset.mode;
        if (mode === currentMode) return;
        document.querySelectorAll('.pill').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentMode = mode;
        deselect();
        renderMode();
      });
    });

    document.querySelectorAll('.depth-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.depth-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentDepth = +btn.dataset.depth;
        if (selectedNode) selectNode(selectedNode);
      });
    });

    document.getElementById('panel-close').addEventListener('click', deselect);

    document.getElementById('hull-toggle').addEventListener('click', function() {
      hullsVisible = !hullsVisible;
      this.classList.toggle('active', hullsVisible);
      updateHulls();
    });

    var allChip = document.querySelector('.engine-chip[data-engine="all"]');
    if (allChip) { allChip.style.color = '#e14b87'; allChip.style.background = 'rgba(225,75,135,.12)'; }

    document.querySelectorAll('.engine-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var eng = chip.dataset.engine;
        currentEngineFilter = (eng === 'all') ? null : eng;
        document.querySelectorAll('.engine-chip').forEach(function(c) {
          c.classList.remove('active'); c.style.color = ''; c.style.background = '';
        });
        chip.classList.add('active');
        var color = (eng === 'all') ? '#e14b87' : (ENGINE_COLORS[eng] ? ENGINE_COLORS[eng].color : '#e14b87');
        chip.style.color = color;
        chip.style.background = 'rgba(' + hexToRgbStr(color) + ',.12)';
        applyEngineFilter();
      });
    });

    document.getElementById('search-box').addEventListener('input', function(e) {
      var q = e.target.value.trim().toLowerCase();
      if (!q) { gNodes.selectAll('g.nd').style('opacity', 1); return; }
      gNodes.selectAll('g.nd').style('opacity', function(d) {
        return (d.name||d.id||'').toLowerCase().includes(q) || (d.title||'').toLowerCase().includes(q)
          ? 1 : .08;
      });
    });

    window.addEventListener('resize', function() {
      var W = window.innerWidth, H = window.innerHeight - 52;
      svgSel.attr('width', W).attr('height', H);
      sim.force('center', d3.forceCenter(W/2, H/2)).alpha(.2).restart();
    });
  }

  Promise.all([
    fetch('/graph/data.json').then(function(r) { return r.json(); }),
    fetch('/graph/collab.json').then(function(r) { return r.json(); }),
  ]).then(function(results) {
    init(results[0].nodes, results[0].edges, results[1]);
  }).catch(function(err) {
    console.error('Graph load error:', err);
    document.getElementById('loading').innerHTML =
      '<div class="loading-text" style="color:#e14b87">Failed to load graph data</div>';
  });

  (function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var vbtn = document.getElementById("voice-btn");
    if (!SR) { if(vbtn) vbtn.style.display="none"; return; }
    var rec = new SR();
    rec.continuous = false; rec.interimResults = false; rec.lang = "en-US";
    var listening = false;
    rec.onresult = function(e){
      var txt = e.results[0][0].transcript;
      var sb = document.getElementById("search-box");
      if(sb){ sb.value = txt; sb.dispatchEvent(new Event("input")); }
    };
    rec.onend = function(){ listening=false; vbtn.style.color="rgba(200,216,240,.4)"; vbtn.style.borderColor="rgba(100,140,255,.15)"; vbtn.style.boxShadow=""; };
    vbtn.addEventListener("click", function(){
      if(listening){ rec.stop(); }
      else { rec.start(); listening=true; vbtn.style.color="#e14b87"; vbtn.style.borderColor="rgba(225,75,135,.4)"; vbtn.style.boxShadow="0 0 12px rgba(225,75,135,.2)"; }
    });
  })();

})();
</script>
</body>
</html>
