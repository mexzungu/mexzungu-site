<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108">
  <!-- Outer form: labia majora. Classic yoni shape, pointed at crown, rounded below -->
  <path d="M50 6 C30 6 12 24 12 50 C12 70 24 92 50 102 C76 92 88 70 88 50 C88 24 70 6 50 6Z"
        fill="rgba(155,127,166,0.06)" stroke="#9B7FA6" stroke-width="1.4" stroke-opacity="0.75"/>
  <!-- Inner form: labia minora. Narrower, same axis -->
  <path d="M50 20 C37 20 27 35 27 50 C27 65 37 80 50 86 C63 80 73 65 73 50 C73 35 63 20 50 20Z"
        fill="rgba(155,127,166,0.09)" stroke="#9B7FA6" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Vestibular opening. Soft inner warmth -->
  <ellipse cx="50" cy="56" rx="7" ry="12" fill="rgba(155,127,166,0.13)" stroke="none"/>
  <!-- Clitoral accent. The crown -->
  <circle cx="50" cy="17" r="2.8" fill="#9B7FA6" opacity="0.72"/>
  <!-- Clitoral hood: subtle arch above -->
  <path d="M44 19 C44 12 56 12 56 19" fill="none" stroke="#9B7FA6" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
